# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/
theme = "blowfish"
baseURL = "https://hakan-karaman.netlify.app/"

enableRobotsTXT = true
paginate = 10
summaryLength = 0

defaultContentLanguage = "tr"
defaultContentLanguageInSubdir = false

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

buildDrafts = false
buildFuture = false

# googleAnalytics = "G-XXXXXXXXX"

[security]
  [security.funcs]
    allowGetJSON = true

[imaging]
  anchor = 'Center'
  quality = 80
  resampleFilter = 'Lanczos'
  hint = 'photo'

[params]
  disableImageOptimization = false
  env = "production"

[taxonomies]
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
