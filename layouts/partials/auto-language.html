<script>
(function() {
  try {
    var supported = ['en', 'ru'];
    var defaultLang = 'tr';
    var stored = localStorage.getItem('preferredLanguage');
    // если пользователь уже выбирал язык вручную — не трогаем
    if (stored && (stored === 'tr' || supported.indexOf(stored) !== -1)) return;
    var path = location.pathname;
    // только на корне "/" — не редиректим с /en/, /ru/, /tr/ и внутренних страниц
    if (path !== '/' && path !== '/index.html') return;
    var navLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
    var browserLang = '';
    for (var i = 0; i < navLangs.length; i++) {
      var l = (navLangs[i] || '').toLowerCase().split('-')[0];
      if (supported.indexOf(l) !== -1) { browserLang = l; break; }
      if (l === defaultLang) { browserLang = defaultLang; break; }
    }
    if (!browserLang) {
      var single = (navigator.language || '').toLowerCase().split('-')[0];
      if (supported.indexOf(single) !== -1) browserLang = single;
    }
    if (!browserLang || browserLang === defaultLang || supported.indexOf(browserLang) === -1) return;
    var target = '/' + browserLang + '/';
    localStorage.setItem('preferredLanguage', browserLang);
    if (path !== target) location.replace(target);
  } catch (e) {}
})();
</script>
